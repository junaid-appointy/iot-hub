  // ---- play / draw ----
  async function play(pattern) {
    try {
      MX.info.status = await api('/matrix/play', { body: { pattern, params: MX.params[pattern] || defaultsFor(pattern), options: MX.options } });
    } catch (e) { toast(e.message, e.hint, true); }
    updateCells();
    renderPanel();
  }
  function defaultsFor(id) {
    const p = MX.info.patterns.find((x) => x.id === id);
    return Object.fromEntries((p?.params || []).map((x) => [x.key, x.default]));
  }
  let updateTimer;
  function pushUpdate(params) {
    if (!mxRunning()) return;
    clearTimeout(updateTimer);
    updateTimer = setTimeout(async () => { try { MX.info.status = await api('/matrix/update', { body: { params, options: MX.options } }); } catch {} }, 250);
  }
  async function paintAt(el) {
    if (!el || MX.mode !== 'draw') return;
    MX.lastPainted = el;
    const r = +el.dataset.r, c = +el.dataset.c;
    const frame = MX.info.status.frame;
    if (frame[r]) frame[r][c] = MX.paintValue;
    updateCells();
    try { MX.info.status = await api('/matrix/pixel', { body: { row: r, col: c, value: MX.paintValue } }); } catch {}
  }

  function optionsHtml(music = false) {
    const o = MX.options;
    const rate = (1000 / o.tickMs).toFixed(1);
    return `<div><h4>Output</h4>
      <div class="send-toggle ${o.preview ? '' : 'live'}"><label class="check"><input type="checkbox" data-opt="live" ${o.preview ? '' : 'checked'}/> <strong>Send to real bulbs</strong></label>
      <div class="desc" style="margin-top:4px">${o.preview ? 'Off: the pattern only plays on this screen.' : 'On: every mapped bulb follows the pattern.'}</div></div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
        ${music ? '' : `<label class="slider-row">Speed<input type="range" min="250" max="2000" step="50" value="${2250 - o.tickMs}" data-opt="speed"/><output>${rate}/s</output></label>`}
        <label class="slider-row">Brightness<input type="range" min="10" max="100" step="10" value="${o.maxBrightness}" data-opt="maxBrightness"/><output>${o.maxBrightness}%</output></label>
        <div class="row2"><label class="f">White<select class="field" data-opt="palette">${PALETTES.map(([k, l]) => `<option value="${k}" ${k === o.palette ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="f">Unlit bulbs<select class="field" data-opt="background"><option value="off" ${o.background === 'off' ? 'selected' : ''}>Off</option><option value="dim" ${o.background === 'dim' ? 'selected' : ''}>Dim glow</option></select></label></div>
      </div>
      ${music ? '' : '<p class="desc" style="margin:8px 0 0">Bulbs react in roughly 0.1–1 s, so fast speeds look smoother on screen than in the room.</p>'}</div>`;
  }

  function playPanel() {
    const pats = MX.info.patterns.filter((p) => p.id !== 'draw');
    const p = pats.find((x) => x.id === MX.pattern) || pats[0];
    const params = (MX.params[p.id] ??= defaultsFor(p.id));
    const running = mxRunning() && MX.info.status.pattern === p.id;
    const paramHtml = (p.params || []).map((x) => {
      if (x.type === 'toggle') return `<label class="check"><input type="checkbox" data-param="${x.key}" ${params[x.key] ? 'checked' : ''}/> ${esc(x.label)}</label>`;
      if (x.type === 'select') return `<label class="f">${esc(x.label)}<select class="field" data-param="${x.key}">${x.options.map((o) => `<option value="${o.value}" ${params[x.key] === o.value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></label>`;
      return `<label class="f">${esc(x.label)}<input class="field" data-param="${x.key}" value="${esc(params[x.key])}" maxlength="60"/></label>`;
    }).join('');
    const btn = (x) => `<button data-pattern="${x.id}" aria-pressed="${x.id === p.id}">${esc(x.name)}</button>`;
    return `<div><h4>Patterns</h4><div class="patterns">${pats.filter((x) => x.category !== 'music').map(btn).join('')}</div>
      <h4 style="margin-top:14px">Music looks <span style="text-transform:none;letter-spacing:0;font-weight:400">· here on a 120 BPM metronome; use Audio or Show for real music</span></h4>
      <div class="patterns">${pats.filter((x) => x.category === 'music').map(btn).join('')}</div>
      <p class="desc" style="margin:10px 0 0">${esc(p.description)}</p>
      ${paramHtml ? `<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${paramHtml}</div>` : ''}
      <div class="btnrow" style="margin-top:12px">${running ? '<button class="btn" data-act="stop">■ Stop</button>' : '<button class="btn primary" data-act="play">▶ Play</button>'}${mxRunning() && !running ? '<button class="btn" data-act="stop">■ Stop current</button>' : ''}</div></div>
      ${optionsHtml()}`;
  }

  function drawPanel() {
    return `<div><h4>Draw</h4><p class="desc" style="margin:0 0 10px">Click or drag across cells to switch them on and off.</p>
      <div class="btnrow"><button class="btn small ${MX.brush === 1 ? 'primary' : ''}" data-brush="1">Full</button><button class="btn small ${MX.brush === 0.5 ? 'primary' : ''}" data-brush="0.5">Half</button><button class="btn small" data-act="clear-canvas">Clear</button></div></div>
      ${optionsHtml()}`;
  }

  function renderPanel() {
    const panel = $('#mxPanel');
    if (!panel) return;
    panel.innerHTML = { map: mapPanel, play: playPanel, draw: drawPanel, audio: audioPanel, show: showPanel }[MX.mode]();
  }

  $('#matrixView').addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act],[data-pattern],[data-brush],[data-music-pattern]');
    if (!t || !t.closest('#mxPanel')) return;
    const act = t.dataset.act;
    try {
      if (t.dataset.musicPattern) return playWith(t.dataset.musicPattern, { stepOn: 'timer' });
      if (act === 'src-mic') return startSource('mic');
      if (act === 'src-system') return startSource('system');
      if (act === 'src-stop') return stopSource();
      if (act === 'beat-play') return playWith(AUDIO.beatPattern, { stepOn: 'beat' });
      if (act === 'autopilot') return setAutopilot(!(MX.info.status?.director === 'autopilot' && MX.info.status.running));
      if (act === 'cal-network') return calibrateNetwork();
      if (act === 'cal-tap') return tapTest();
      if (await onShowAct(act, t)) return;
      if (t.dataset.pattern) { MX.pattern = t.dataset.pattern; if (mxRunning() && MX.info.status.pattern !== 'draw') await play(MX.pattern); else renderPanel(); return; }
      if (t.dataset.brush) { MX.brush = +t.dataset.brush; renderPanel(); return; }
      if (act === 'start-wizard') return startWizard();
      if (act === 'stop-wizard') return stopWizard();
      if (act === 'skip') { MX.wizard.skipped.add(MX.wizard.current); await api('/matrix/identify-stop', { body: { after: 'off' } }); return nextWizard(); }
      if (act === 'undo') {
        const last = MX.wizard.history.pop();
        const pos = MX.info.layout.cells.flatMap((row, r) => row.map((id, c) => [id, r, c])).find(([id]) => id === last);
        if (pos) await assignCell(pos[1], pos[2], null);
        await api('/matrix/identify-stop', { body: { after: 'off' } });
        MX.wizard.current = last; await flash(last); renderPanel(); return;
      }
      if (act === 'pick') {
        const id = t.dataset.id;
        if (MX.selectedCell && !cellAt(...MX.selectedCell)) { await assignCell(...MX.selectedCell, id); MX.selectedCell = null; toast('Placed'); updateCells(); renderPanel(); return; }
        MX.picked = id; await flash(id); renderPanel(); return;
      }
      if (act === 'cancel-pick') { MX.picked = null; await api('/matrix/identify-stop', { body: { after: 'off' } }); MX.info = await api('/matrix'); updateCells(); renderPanel(); return; }
      if (act === 'flash') return flash(t.dataset.id);
      if (act === 'stop-flash') { await api('/matrix/identify-stop', { body: { after: 'dim' } }); MX.info = await api('/matrix'); updateCells(); return; }
      if (act === 'unassign') { await assignCell(...MX.selectedCell, null); MX.selectedCell = null; updateCells(); renderPanel(); return; }
      if (act === 'resize') {
        const rows = +$('[data-size=rows]').value, cols = +$('[data-size=cols]').value;
        MX.info = await api('/matrix/create', { body: { rows, cols } }); renderMatrix(); return;
      }
      if (act === 'clear-map') { if (!confirm('Remove every bulb from the grid? The size and numbering stay.')) return; MX.info = await api('/matrix/clear-map', { method: 'POST' }); updateCells(); renderPanel(); return; }
      if (act === 'play') return play(MX.pattern);
      if (act === 'stop') { MX.info.status = await api('/matrix/stop', { method: 'POST' }); updateCells(); renderPanel(); return; }
      if (act === 'clear-canvas') { MX.info.status = await api('/matrix/clear-canvas', { method: 'POST' }); updateCells(); return; }
    } catch (err) { toast(err.message, err.hint, true); }
  });

  $('#matrixView').addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.audio === 'device') { AUDIO.deviceId = t.value; if (AUDIO.source === 'mic') startSource('mic'); return; }
    if (t.dataset.audio === 'beatPattern') { AUDIO.beatPattern = t.value; return; }
    if (t.dataset.show === 'open') { if (t.value) openShow(t.value); return; }
    if (t.dataset.show === 'file') { onSongFile(t.files[0]); return; }
    if (t.dataset.cue) {
      const cue = SHOW.show.cues[+t.closest('.cue').dataset.i];
      if (t.dataset.cue === 't') {
        const v = parseTime(t.value);
        if (Number.isNaN(v)) { toast('Use m:ss.s, e.g. 1:23.5', null, true); t.value = fmt(cue.t); return; }
        cue.t = Math.max(0, Math.min(SHOW.show.audio.duration, v));
        SHOW.show.cues.sort((a, b) => a.t - b.t);
      }
      if (t.dataset.cue === 'pattern') { cue.pattern = t.value; cue.params = undefined; if (isMusicPattern(t.value)) cue.stepOn = 'timer'; }
      if (t.dataset.cue === 'palette') cue.palette = t.value;
      if (t.dataset.cue === 'beat') cue.stepOn = t.checked ? 'beat' : 'timer';
      pushShowEdit();
      renderPanel(); drawTimeline();
      return;
    }
    if (t.dataset.num) return saveNumbering({ [t.dataset.num]: t.type === 'checkbox' ? t.checked : t.value });
    if (t.dataset.param !== undefined) {
      const params = MX.params[MX.pattern];
      params[t.dataset.param] = t.type === 'checkbox' ? t.checked : t.value;
      if (mxRunning() && MX.info.status.pattern === MX.pattern) pushUpdate(params);
      return;
    }
    if (t.dataset.opt === 'live') {
      if (t.checked && !confirm('Send the pattern to the real bulbs?')) { t.checked = false; return; }
      MX.options.preview = !t.checked; pushUpdate(); renderPanel(); return;
    }
    if (t.dataset.opt === 'palette') { MX.options.palette = t.value; pushUpdate(); updateCells(); return; }
    if (t.dataset.opt === 'background') { MX.options.background = t.value; pushUpdate(); return; }
  });
  $('#matrixView').addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.audio === 'sens') { analyzer().sensitivity = +t.value; t.nextElementSibling.textContent = Math.round(+t.value * 100) + '%'; return; }
    if (t.dataset.show === 'offset') { SHOW.show.offsetMs = +t.value; t.nextElementSibling.textContent = `${+t.value > 0 ? '+' : ''}${t.value} ms`; pushShowEdit(); return; }
    if (t.dataset.show === 'name') { SHOW.show.name = t.value; SHOW.dirty = true; const b = $('[data-act=show-save]'); if (b) b.textContent = 'Save show'; return; }
    if (t.dataset.opt === 'speed') { MX.options.tickMs = 2250 - +t.value; t.nextElementSibling.textContent = (1000 / MX.options.tickMs).toFixed(1) + '/s'; pushUpdate(); }
    if (t.dataset.opt === 'maxBrightness') { MX.options.maxBrightness = +t.value; t.nextElementSibling.textContent = t.value + '%'; pushUpdate(); }
    if (t.dataset.param !== undefined && t.type === 'text') { MX.params[MX.pattern][t.dataset.param] = t.value; if (mxRunning() && MX.info.status.pattern === MX.pattern) pushUpdate(MX.params[MX.pattern]); }
  });

  // Live frames while something is playing or flashing (faster when sound drives it).
  (function pollFrames() {
    const fast = mxRunning() && (MX.mode === 'audio' || MX.mode === 'show' || MX.mode === 'play');
    setTimeout(async () => {
      if (!$('#matrixView').hidden && MX.info?.layout && document.visibilityState === 'visible' && (mxRunning() || MX.info.status?.identifying)) {
        try { MX.info.status = await api('/matrix/status'); updateCells(); } catch {}
      }
      pollFrames();
    }, fast ? 100 : 400);
  })();

  // ---------- audio: live sound → matrix ----------
  const AUDIO = { analyzer: null, source: null, devices: [], deviceId: '', unsub: null, error: '', last: null, beatPattern: 'chase' };
  const analyzer = () => (AUDIO.analyzer ??= new IotAudio.LiveAnalyzer());
  const isMusicPattern = (id) => MX.info?.patterns.find((p) => p.id === id)?.category === 'music';

  /**
   * Live data to the server, batched per analysis frame: predicted groove hits
   * (sent ~0.6 s ahead so bulbs land on time), unpredicted onsets (sent at once),
   * the tempo grid whenever it moves, and levels/bands ~10x a second.
   */
  const OUT = { hits: [], grid: undefined, lastGridKey: '', lastFeat: 0, lastSend: 0 };
  function queueLive(f) {
    const tr = analyzer().tracker, now = IotAudio.wallNow();
    OUT.hits.push(...tr.predictions(now, 700));
    for (const o of f.onsets) if (!tr.wasPredicted(o.type, o.at)) OUT.hits.push(o);
    // Until the beat is locked, kicks double as beats so beat-driven looks still move.
    if (!tr.locked) for (const o of f.onsets) if (o.type === 'kick') OUT.hits.push({ ...o, type: 'beat' });
    const g = tr.grid();
    const key = g ? `${g.anchorBeat}:${g.locked}:${g.downbeat}` : 'none';
    if (key !== OUT.lastGridKey) { OUT.grid = g; OUT.lastGridKey = key; }
    const featDue = now - OUT.lastFeat > 100;
    if (!OUT.hits.length && OUT.grid === undefined && !featDue) return;
    const body = {};
    if (OUT.hits.length) body.hits = OUT.hits.splice(0);
    if (OUT.grid !== undefined) { body.grid = OUT.grid; OUT.grid = undefined; }
    if (featDue) {
      Object.assign(body, { level: f.level, bands: f.bands, stereo: f.stereo, timbre: f.timbre && { centroid: f.timbre.centroid, flatness: f.timbre.flatness, flux: f.timbre.flux }, pitch: f.pitch, chroma: f.chroma });
      OUT.lastFeat = now;
    }
    fetch('/api/audio', { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true, body: JSON.stringify(body) }).catch(() => {});
  }

  function attachAnalyzer(sendLive) {
    AUDIO.unsub?.();
    AUDIO.unsub = analyzer().onFeatures((f) => {
      AUDIO.last = f;
      if (sendLive) queueLive(f);
      drawMeters(f);
      labFeatures(f);
    });
  }

  async function setSource(kind) {
    try { MX.info.status = await api('/matrix/source', { body: { kind } }); } catch {}
  }

  async function startSource(kind) {
    AUDIO.error = '';
    if (SHOW.playing) showPause();
    const a = analyzer();
    a.onEnded = () => { AUDIO.source = null; toast('Sound sharing ended'); renderPanel(); };
    try {
      if (kind === 'mic') await a.useMicrophone(AUDIO.deviceId || undefined);
      else await a.useSystemAudio();
      AUDIO.source = kind;
      attachAnalyzer(true);
      await setSource('live');
      if (kind === 'mic') AUDIO.devices = await IotAudio.LiveAnalyzer.inputDevices?.() ?? (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput').map((d, i) => ({ id: d.deviceId, label: d.label || `Input ${i + 1}` }));
    } catch (e) {
      AUDIO.source = null;
      AUDIO.error = e.name === 'NotAllowedError'
        ? (kind === 'mic' ? 'Microphone access was blocked. Allow it from the icon in the address bar, then try again.' : 'Sharing was cancelled.')
        : e.name === 'NotFoundError' ? 'No microphone found.' : e.message;
    }
    renderPanel();
  }

  function stopSource() {
    AUDIO.analyzer?.stop();
    AUDIO.unsub?.();
    AUDIO.source = null;
    setSource('metronome');
    if (MX.mode === 'audio') renderPanel();
  }

  function drawMeters(f) {
    const m = $('#meters');
    if (!m) return;
    m.querySelectorAll('.bar i').forEach((el, i) => (el.style.height = Math.round((f.bands[i] ?? 0) * 100) + '%'));
    const lvl = $('#levelBar');
    if (lvl) lvl.style.width = Math.round(f.level * 100) + '%';
    if (f.beat) { const d = $('#beatDot'); if (d) { d.classList.remove('hit'); void d.offsetWidth; d.classList.add('hit'); } }
    const tr = analyzer().tracker;
    const lock = $('#lockBadge');
    if (lock) {
      lock.className = 'pill ' + (tr.locked ? 'ok' : 'warn');

      const now = IotAudio.wallNow();
      const beatsFromNext = (now - tr.nextBeat) / tr.period;
      const beatNow = Math.floor(tr.beatIndex + beatsFromNext);
      const inBar = (((beatNow - tr.downSlot) % 4) + 4) % 4;
      dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i === inBar && tr.locked));
    }
  }

  // ---------- sync calibration ----------
  function syncHtml() {
    const cal = MX.info.calibration || {};
    const lat = MX.info.latency || {};
    const rtts = Object.values(cal.bulbs || {}).map((b) => b.rttMs).filter((x) => typeof x === 'number');
    const unreachable = Object.values(cal.bulbs || {}).filter((b) => b.rttMs === null).length;
    const when = (iso) => (iso ? new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '');
    return `<div><h4>Sync</h4>
      <div class="desc">Light delay <strong>${lat.baseMs ?? '–'} ms</strong> · ${cal.lightSource === 'tap' ? `tap-calibrated ${when(cal.lightMeasuredAt)}` : 'estimated — run the tap test for exact sync'}</div>
      <div class="desc">${rtts.length ? `Network: ${rtts.length} bulbs measured ${when(cal.networkMeasuredAt)} · slowest ${Math.max(...rtts)} ms round trip${unreachable ? ` · ${unreachable} didn't answer` : ''}` : 'Network delay not measured yet.'}</div>
      <div class="btnrow" style="margin-top:8px"><button class="btn small" data-act="cal-network">Measure network</button><button class="btn small" data-act="cal-tap">Tap test…</button></div>
      <p class="desc" style="margin:6px 0 0">Each bulb gets its commands early by its own delay, so all ${Object.keys(lat.perBulb || {}).length || 'the'} bulbs change together, on the beat.</p></div>`;
  }

  async function calibrateNetwork() {
    toast('Measuring every bulb… (about 2 s)');
    try {
      const r = await api('/matrix/calibrate-network', { method: 'POST' });
      MX.info = await api('/matrix');
      toast(`Measured: median ${r.medianMs} ms round trip${r.unreachable.length ? ` · ${r.unreachable.length} didn't answer` : ''}`, r.slowest.length ? `Slowest: ${r.slowest.slice(0, 3).map((s) => `${s.name} ${s.rttMs} ms`).join(', ')}` : null);
    } catch (e) { toast(e.message, e.hint, true); }
    renderPanel();
  }

  /** Guided tap test: taps to clicks (sound), then taps to flashes (light). Personal tap timing cancels out. */
  async function tapTest() {
    const m = modal('Sync calibration');
    const ctx = (await analyzer().ensureContext(), analyzer().ctx);
    const result = {};
    let taps = [];
    const onKey = (e) => { if (e.code === 'Space') { e.preventDefault(); taps.push(IotAudio.wallNow()); flashPad(); } };
    const flashPad = () => { const p = $('#tapPad', m.body); if (p) { p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit'); } };
    document.addEventListener('keydown', onKey);
    const cleanup = () => document.removeEventListener('keydown', onKey);
    m.el.addEventListener('click', (e) => { if (e.target === m.el || e.target.closest('[data-close]')) cleanup(); });
    const pad = (label) => `<button class="tap-pad" id="tapPad">${label}<small>or press the space bar</small></button>`;
    const bindPad = () => $('#tapPad', m.body)?.addEventListener('pointerdown', (e) => { e.preventDefault(); taps.push(IotAudio.wallNow()); flashPad(); });
    const run = async (kind) => {
      taps = [];
      const count = 16, interval = 650;
      let events;
      if (kind === 'sound') events = await IotAudio.playClicks(ctx, count, interval, 1500);
      else {
        const start = Date.now() + 1800;
        events = Array.from({ length: count }, (_, i) => start + i * interval);
        await api('/matrix/calibrate-flash', { body: { times: events, onMs: 180 } });
      }
      await new Promise((r) => setTimeout(r, events[events.length - 1] - Date.now() + 900));
      return IotAudio.tapOffset(events, taps);
    };
    const step = (n, title, text, action) => {
      m.body.innerHTML = `<div class="steps-title">Step ${n} of 3 · ${title}</div><p class="desc" style="margin:0">${text}</p>${pad(action)}<div id="tapMsg"></div>`;
      bindPad();
    };
    m.actions.innerHTML = '<button class="btn" data-close>Cancel</button>';

    // 1. Network
    m.body.innerHTML = '<div class="steps-title">Step 1 of 3 · Network</div><div class="waiting"><span class="spinner"></span>Measuring each bulb’s network delay…</div>';
    try {
      const r = await api('/matrix/calibrate-network', { method: 'POST' });
      result.network = r;
      if (!r.medianMs) throw new Error('No bulb answered. Are you on the same network as the bulbs?');
    } catch (e) {
      m.body.innerHTML = `<div class="msg error">${esc(e.message)}</div>`;
      return cleanup();
    }
    // 2. Sound
    for (;;) {
      step(2, 'Sound', 'Use the speakers you’ll play music on. You’ll hear 16 clicks — tap along on every click, as if playing a drum.', 'Tap on each click');
      const r = await run('sound');
      if (r && r.spreadMs < 90) { result.audio = r; break; }
      $('#tapMsg', m.body).innerHTML = `<div class="msg warn">${r ? `Taps were too uneven (±${r.spreadMs} ms).` : 'Not enough taps.'} Let’s try that again.</div>`;
      await new Promise((r2) => setTimeout(r2, 1800));
    }
    // 3. Light
    for (;;) {
      step(3, 'Light', 'Now look at the bulbs (not the screen). They’ll flash 16 times — tap on every flash.', 'Tap on each flash');
      const r = await run('light');
      if (r && r.spreadMs < 110) { result.light = r; break; }
      $('#tapMsg', m.body).innerHTML = `<div class="msg warn">${r ? `Taps were too uneven (±${r.spreadMs} ms).` : 'Not enough taps — are the bulbs flashing?'} Let’s try again.</div>`;
      await new Promise((r2) => setTimeout(r2, 1800));
    }
    cleanup();
    try {
      const saved = await api('/matrix/calibrate-taps', { body: { audioTapMs: result.audio.offsetMs, lightTapMs: result.light.offsetMs, outputLatencyMs: analyzer().outputLatencyMs, taps: result.audio.used + result.light.used } });
      MX.info = await api('/matrix');
      m.body.innerHTML = `<div class="msg success">Calibrated. Bulbs need their commands <strong>${saved.lightLatencyMs} ms</strong> early; the slowest bulbs get extra from the network test.</div>
        <dl class="kv"><dt>Your tap vs sound</dt><dd>${result.audio.offsetMs} ms (±${result.audio.spreadMs})</dd><dt>Your tap vs light</dt><dd>${result.light.offsetMs} ms (±${result.light.spreadMs})</dd><dt>Speaker delay</dt><dd>${analyzer().outputLatencyMs} ms (reported by the browser)</dd><dt>Network</dt><dd>median ${result.network.medianMs} ms round trip</dd></dl>
        <p class="desc">Saved in <code>layouts/auditorium.json</code>. Redo it if you change speakers (e.g. Bluetooth) or venue.</p>`;
      m.actions.innerHTML = '<button class="btn primary" data-close>Done</button>';
      renderPanel();
    } catch (e) {
      m.body.innerHTML = `<div class="msg error">${esc(e.message)}</div>`;
    }
  }

  // ---------- show: choreograph a song ----------
  const SHOW = { list: [], show: null, audioEl: null, url: null, playing: false, raf: 0, dirty: false, busy: '', syncTimer: 0, lastAnchor: 0, editTimer: 0 };
  const fmt = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
  const parseTime = (v) => { const m = String(v).trim().match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/); return m ? (+(m[1] || 0)) * 60 + +m[2] : NaN; };
  const PALETTE_COLORS = ['#f97316', '#0ea5e9', '#a855f7', '#22c55e', '#eab308', '#ef4444', '#14b8a6', '#ec4899', '#6366f1', '#84cc16'];
  const colorFor = (id) => PALETTE_COLORS[[...id].reduce((a, ch) => a + ch.charCodeAt(0), 0) % PALETTE_COLORS.length];
  const SECTION_COLORS = { intro: '#64748b', verse: '#0ea5e9', build: '#f59e0b', drop: '#ef4444', chorus: '#a855f7', breakdown: '#14b8a6', outro: '#64748b' };

  async function loadShowList() {
    try { SHOW.list = (await api('/shows')).shows; } catch { SHOW.list = []; }
  }

  function setSongElement(file) {
    if (SHOW.url) URL.revokeObjectURL(SHOW.url);
    SHOW.url = URL.createObjectURL(file);
    SHOW.audioEl = new Audio(SHOW.url);
    SHOW.audioEl.preload = 'auto';
    for (const ev of ['seeked', 'pause', 'play', 'ratechange']) SHOW.audioEl.addEventListener(ev, () => syncShow(true));
    SHOW.audioEl.addEventListener('ended', () => showStop());
  }

  async function onSongFile(file) {
    if (!file) return;
    showPause();
    // Re-attaching the song to a saved show: no need to analyse again, the map is in the show.
    if (SHOW.show?.beats?.length && SHOW.show.downbeats) {
      setSongElement(file);
      await new Promise((r) => SHOW.audioEl.addEventListener('loadedmetadata', r, { once: true }));
      if (Math.abs(SHOW.audioEl.duration - SHOW.show.audio.duration) > 1) toast(`This file is ${fmt(SHOW.audioEl.duration)} long but the show was made for ${fmt(SHOW.show.audio.duration)}`, 'Cue times may not line up.', true);
      renderPanel(); drawTimeline();
      return;
    }
    SHOW.busy = 'Reading the song…';
    renderPanel();
    try {
      setSongElement(file);
      const a = await IotAudio.analyzeSong(await file.arrayBuffer(), (msg) => { SHOW.busy = msg; const b = $('#showBusy'); if (b) b.textContent = msg; });
      SHOW.show = {
        name: file.name.replace(/\.[^.]+$/, ''),
        layout: 'auditorium',
        audio: { fileName: file.name, duration: a.duration },
        bpm: a.bpm, beats: a.beats, downbeats: a.downbeats, kicks: a.kicks, snares: a.snares, hats: a.hats,
        env: a.env, bands: a.bands, sections: a.sections,
        offsetMs: 0,
        cues: IotAudio.autoChoreograph(a),
      };
      SHOW.dirty = true;
      const counts = a.sections.map((s) => IotAudio.PRETTY[s.type] || s.type);
      toast(`${a.bpm} BPM · ${a.downbeats.length} bars · ${SHOW.show.cues.length} cues`, `Sections: ${counts.join(' → ')}`);
    } catch (e) {
      toast("Couldn't read that audio file", e.message, true);
    }
    SHOW.busy = '';
    renderPanel();
    drawTimeline();
  }

  async function openShow(id) {
    showStop();
    try {
      SHOW.show = await api('/shows/' + encodeURIComponent(id));
      SHOW.audioEl = null;
      SHOW.dirty = false;
      if (!SHOW.show.downbeats) toast('This show was made with an older version', 'Pick the song and run Auto-choreograph to get bars, drum hits and sections.');
    } catch (e) { toast(e.message, e.hint, true); }
    renderPanel();
    drawTimeline();
  }

  /** Wall time at which song time 0 is *heard* (speaker delay included). */
  const anchorNow = () => IotAudio.wallNow() - SHOW.audioEl.currentTime * 1000 + analyzer().outputLatencyMs;

  function syncShow(force) {
    if (!SHOW.audioEl || !SHOW.show || (!SHOW.playing && !force)) return;
    const anchor = anchorNow();
    // currentTime is coarse (~10 ms); only re-send when the anchor really moved.
    if (!force && Math.abs(anchor - SHOW.lastAnchor) < 12) return;
    SHOW.lastAnchor = anchor;
    fetch('/api/show/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ anchorMs: Math.round(anchor), playing: SHOW.playing && !SHOW.audioEl.paused }) }).catch(() => {});
  }

  async function showPlay() {
    if (!SHOW.audioEl) return toast('Pick the song file first');
    if (!SHOW.show.downbeats) return toast('Run Auto-choreograph first', 'This show has no bar/drum map yet.');
    if (AUDIO.source) stopSource();
    await analyzer().useElement(SHOW.audioEl);
    attachAnalyzer(false);
    try { await SHOW.audioEl.play(); } catch (e) { return toast("Couldn't play the song", e.message, true); }
    SHOW.playing = true;
    SHOW.lastAnchor = anchorNow();
    try {
      MX.info.status = await api('/show/play', { body: { show: SHOW.show, anchorMs: Math.round(SHOW.lastAnchor), options: MX.options } });
    } catch (e) { toast(e.message, e.hint, true); }
    clearInterval(SHOW.syncTimer);
    SHOW.syncTimer = setInterval(() => syncShow(false), 1000);
    renderPanel();
    cancelAnimationFrame(SHOW.raf);
    const loop = () => {
      if (!SHOW.playing) return;
      drawTimeline();
      const time = $('#showTime');
      if (time) time.textContent = `${fmt(SHOW.audioEl.currentTime)} / ${fmt(SHOW.show.audio.duration)}`;
      SHOW.raf = requestAnimationFrame(loop);
    };
    SHOW.raf = requestAnimationFrame(loop);
  }

  function showPause() {
    if (!SHOW.playing) return;
    SHOW.playing = false;
    cancelAnimationFrame(SHOW.raf);
    clearInterval(SHOW.syncTimer);
    SHOW.audioEl?.pause();
    fetch('/api/show/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ playing: false }) }).catch(() => {});
    if (MX.mode === 'show') renderPanel();
  }

  function showStop() {
    const was = SHOW.playing;
    showPause();
    if (SHOW.audioEl) SHOW.audioEl.currentTime = 0;
    if (was || mxRunning()) api('/show/stop', { method: 'POST' }).then((st) => { MX.info.status = st; updateCells(); }).catch(() => {});
    if (MX.mode === 'show') renderPanel();
    drawTimeline();
  }

  function seek(t) {
    if (!SHOW.audioEl) return;
    SHOW.audioEl.currentTime = Math.max(0, Math.min(SHOW.show.audio.duration - 0.05, t));
    drawTimeline();
    const time = $('#showTime');
    if (time) time.textContent = `${fmt(SHOW.audioEl.currentTime)} / ${fmt(SHOW.show.audio.duration)}`;
  }

  /** Push cue/offset edits to a playing show (debounced). */
  function pushShowEdit() {
    SHOW.dirty = true;
    const b = $('[data-act=show-save]'); if (b) b.textContent = 'Save show';
    if (!SHOW.playing) return;
    clearTimeout(SHOW.editTimer);
    SHOW.editTimer = setTimeout(() => api('/show/edit', { body: { cues: SHOW.show.cues, offsetMs: SHOW.show.offsetMs } }).catch(() => {}), 250);
  }

  function currentCueIndex() {
    if (!SHOW.audioEl || !SHOW.show) return -1;
    const t = SHOW.audioEl.currentTime;
    let idx = -1;
    SHOW.show.cues.forEach((c, i) => { if (c.t <= t) idx = i; });
    return idx;
  }

  function drawTimeline() {
    const canvas = $('#timeline');
    if (!canvas || !SHOW.show) return;
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    const g = canvas.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const s = SHOW.show, dur = s.audio.duration;
    const x = (t) => (t / dur) * w;
    const css = getComputedStyle(document.documentElement);
    const muted = css.getPropertyValue('--faint').trim() || '#999';
    const now = currentCueIndex();
    // Cue blocks (top band).
    s.cues.forEach((c, i) => {
      const x0 = x(c.t), x1 = x(s.cues[i + 1]?.t ?? dur);
      g.fillStyle = colorFor(c.pattern) + (i === now ? 'ff' : '99');
      g.fillRect(x0, 0, Math.max(1, x1 - x0 - 1), 22);
      g.fillStyle = '#fff';
      g.font = '600 11px system-ui, sans-serif';
      const name = MX.info.patterns.find((p) => p.id === c.pattern)?.name || c.pattern;
      if (x1 - x0 > 40) g.fillText(name, x0 + 4, 15, x1 - x0 - 8);
    });
    // Loudness envelope.
    const env = s.env || [];
    if (env.length) {
      g.fillStyle = css.getPropertyValue('--accent').trim() + '55';
      g.beginPath();
      g.moveTo(0, h - 14);
      for (let px = 0; px <= w; px++) g.lineTo(px, h - 14 - ((env[Math.min(env.length - 1, Math.floor((px / w) * env.length))] || 0) / 99) * (h - 44));
      g.lineTo(w, h - 14);
      g.fill();
    }
    // Bar lines (every 4 bars stronger).
    g.fillStyle = muted + '88';
    (s.downbeats || []).forEach((bi, k) => { const t = s.beats[bi]; if (t !== undefined) g.fillRect(x(t), 26, 1, k % 4 === 0 ? 8 : 3); });
    // Sections (bottom band).
    (s.sections || []).forEach((sec) => {
      g.fillStyle = SECTION_COLORS[sec.type] || '#888';
      g.fillRect(x(sec.start), h - 12, Math.max(1, x(sec.end) - x(sec.start) - 1), 12);
      g.fillStyle = '#fff';
      g.font = '600 9.5px system-ui, sans-serif';
      if (x(sec.end) - x(sec.start) > 36) g.fillText((IotAudio.PRETTY[sec.type] || sec.type).toUpperCase(), x(sec.start) + 3, h - 3, x(sec.end) - x(sec.start) - 6);
    });
    if (!SHOW.audioEl) {
      g.fillStyle = muted;
      g.font = '12px system-ui, sans-serif';
      g.fillText('Pick the song file to play this show', 8, h / 2 + 6);
    } else {
      g.fillStyle = css.getPropertyValue('--text').trim();
      g.fillRect(x(SHOW.audioEl.currentTime), 0, 2, h);
    }
    if (SHOW.playing) document.querySelectorAll('.cue').forEach((el) => el.classList.toggle('now', +el.dataset.i === now));
  }

  function showPanel() {
    const s = SHOW.show;
    const pats = MX.info.patterns.filter((p) => p.id !== 'draw');
    const head = `<div><h4>Show</h4>
      <div class="row2"><select class="field" data-show="open"><option value="">${s?.id ? 'Open another show…' : 'Open a saved show…'}</option>${SHOW.list.map((x) => `<option value="${esc(x.id)}" ${x.id === s?.id ? 'selected' : ''}>${esc(x.name)} (${x.cues} cues)</option>`).join('')}</select>
      <button class="btn small" data-act="show-new">New show</button></div></div>`;
    if (SHOW.busy) return head + `<div class="waiting"><span class="spinner"></span><span id="showBusy">${esc(SHOW.busy)}</span></div>`;
    if (!s) {
      return head + `<div class="callout"><div><strong>Pick a song</strong>. I’ll find its tempo, bars, drum hits and sections (intro, build-up, drop…) and choreograph it; then change anything you like.</div>
        <input type="file" accept="audio/*" data-show="file" /></div>
        <p class="desc">The song stays on your computer; the show (cues + song map) is saved to <code>shows/</code> in the repo.</p>${syncHtml()}`;
    }
    const needFile = !SHOW.audioEl;
    const st = MX.info.status;
    const bars = s.downbeats?.length ?? 0;
    const sections = (s.sections || []).map((x) => `<span class="chip-s" style="background:${SECTION_COLORS[x.type] || '#888'}">${esc(IotAudio.PRETTY[x.type] || x.type)}</span>`).join('');
    const PALS = [['dual', 'W+C'], ['cool', 'Cool'], ['warm', 'Warm'], ['neutral', 'Neut.']];
    return head + `
      <div><label class="f">Name<input class="field" data-show="name" value="${esc(s.name)}" maxlength="60"/></label>
        <p class="desc" style="margin:6px 0 0">🎵 ${esc(s.audio.fileName)} · ${fmt(s.audio.duration)}${s.bpm ? ` · ${s.bpm} BPM` : ''} · ${bars} bars</p>
        ${sections ? `<div class="btnrow" style="margin-top:6px">${sections}</div>` : ''}</div>
      ${needFile ? `<div class="callout"><div><strong>Pick the song file</strong> (${esc(s.audio.fileName)}) to play or edit this show.</div><input type="file" accept="audio/*" data-show="file" /></div>` : ''}
      <div><h4>Play</h4>
        <div class="transport">
          ${SHOW.playing ? '<button class="btn" data-act="show-pause">❚❚ Pause</button>' : `<button class="btn primary" data-act="show-play" ${needFile ? 'disabled' : ''}>▶ Play show</button>`}
          <button class="btn small" data-act="show-stop" ${needFile ? 'disabled' : ''}>■</button>
          <span class="time" id="showTime">${fmt(SHOW.audioEl?.currentTime || 0)} / ${fmt(s.audio.duration)}</span>
        </div>
        ${SHOW.playing && st?.section ? `<div class="desc" style="margin-top:6px">Now: <strong>${esc(IotAudio.PRETTY[st.section] || st.section)}</strong> · bar ${st.bar + 1}.${st.beatInBar + 1}</div>` : ''}
        <label class="slider-row" style="margin-top:10px" title="Fine-tune on top of calibration">Fine offset<input type="range" min="-300" max="300" step="10" value="${s.offsetMs || 0}" data-show="offset"/><output>${(s.offsetMs || 0) > 0 ? '+' : ''}${s.offsetMs || 0} ms</output></label>
        <p class="desc" style="margin:4px 0 0">Lights early? Move right. Late? Move left. Playback is timed by the server, so the tab can be in the background.</p>
      </div>
      <div><h4>Cues (${s.cues.length})</h4>
        <div class="btnrow" style="margin-bottom:8px">
          <button class="btn small" data-act="cue-add" ${needFile ? 'disabled' : ''}>+ Cue at playhead</button>
          <button class="btn small" data-act="auto" ${s.beats?.length ? '' : 'disabled'}>Auto-choreograph</button>
        </div>
        <div class="cues">${s.cues.map((c, i) => `
          <div class="cue" data-i="${i}">
            <input class="field" value="${fmt(c.t)}" data-cue="t" title="Start time (m:ss.s). Click the timeline to jump." />
            <select class="field" data-cue="pattern">${pats.map((p) => `<option value="${p.id}" ${p.id === c.pattern ? 'selected' : ''}>${esc(p.name)}${p.category === 'music' ? ' ♫' : ''}</option>`).join('')}</select>
            <select class="field" data-cue="palette" title="White: warm+cool (the look decides), cool, warm or neutral">${PALS.map(([v, l]) => `<option value="${v}" ${(c.palette || 'dual') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
            <label title="Advance a basic pattern on each beat"><input type="checkbox" data-cue="beat" ${c.stepOn === 'beat' ? 'checked' : ''} ${isMusicPattern(c.pattern) ? 'disabled' : ''}/>beat</label>
            <button class="x" data-act="cue-del" title="Delete cue">×</button>
          </div>`).join('')}</div>
        <p class="desc" style="margin:6px 0 0">♫ follows beats, bars and drum hits · “beat” steps a basic pattern on each beat.</p>
      </div>
      <div class="btnrow"><button class="btn primary" data-act="show-save">${SHOW.dirty ? 'Save show' : 'Saved'}</button>${s.id ? '<button class="btn small danger" data-act="show-delete">Delete</button>' : ''}</div>
      ${optionsHtml(true)}
      ${syncHtml()}`;
  }

  async function onShowAct(act, t) {
    const s = SHOW.show;
    if (act === 'show-new') { showStop(); SHOW.show = null; SHOW.audioEl = null; renderPanel(); drawTimeline(); return true; }
    if (act === 'show-play') { await showPlay(); return true; }
    if (act === 'show-pause') { showPause(); return true; }
    if (act === 'show-stop') { showStop(); return true; }
    if (act === 'auto') {
      if (s.cues.length && !confirm('Replace all cues with an automatic choreography?')) return true;
      s.cues = IotAudio.autoChoreograph({ ...s, duration: s.audio.duration });
      pushShowEdit(); renderPanel(); drawTimeline(); return true;
    }
    if (act === 'cue-add') {
      const now = SHOW.audioEl?.currentTime || 0;
      // Snap to the nearest bar line.
      const bars = (s.downbeats || []).map((i) => s.beats[i]);
      const snapped = bars.length ? bars.reduce((a, b) => (Math.abs(b - now) < Math.abs(a - now) ? b : a), bars[0]) : now;
      s.cues = [...s.cues, { t: Math.round(snapped * 100) / 100, pattern: 'kick-snare', palette: 'dual', stepOn: 'timer' }].sort((a, b) => a.t - b.t);
      pushShowEdit(); renderPanel(); drawTimeline(); return true;
    }
    if (act === 'cue-del') {
      s.cues.splice(+t.closest('.cue').dataset.i, 1);
      pushShowEdit(); renderPanel(); drawTimeline(); return true;
    }
    if (act === 'show-save') {
      try {
        const saved = await api('/shows/' + encodeURIComponent(s.id || s.name), { method: 'PUT', body: s });
        SHOW.show = saved; SHOW.dirty = false;
        await loadShowList();
        toast(`Saved to shows/${saved.id}.json`);
      } catch (e) { toast(e.message, e.hint, true); }
      renderPanel(); return true;
    }
    if (act === 'show-delete') {
      if (!confirm(`Delete the show "${s.name}"?`)) return true;
      await api('/shows/' + encodeURIComponent(s.id), { method: 'DELETE' }).catch(() => {});
      showStop(); SHOW.show = null; SHOW.audioEl = null;
      await loadShowList(); renderPanel(); drawTimeline(); return true;
    }
    return false;
  }

  // ---------- Sound Lab: every property of the sound, live ----------
  const LAB = { built: false, layers: { wash: true, bass: true, kick: true, snare: true, hats: true, melody: true, drops: true }, last: null, n: 0, img: null, lamps: {}, pollTimer: 0 };
  const LAB_LAYERS = [['wash', 'Wash'], ['bass', 'Bass'], ['kick', 'Kick'], ['snare', 'Snare'], ['hats', 'Hats'], ['melody', 'Melody'], ['drops', 'Drops']];
  const LAB_WARM = [255, 168, 86], LAB_COOL = [212, 229, 255];
  const labMix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const labRgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const labAll = (sel) => [...document.querySelectorAll(sel)];
  const NOTE = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];

  function labCanvas(id) {
    const c = $('#' + id);
    if (!c) return null;
    const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
    if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { c, g, W, H };
  }
  const labLabel = (g, text, x, y, align = 'left') => { g.fillStyle = '#7b786f'; g.font = '11px ui-monospace, Menlo, monospace'; g.textAlign = align; g.fillText(text, x, y); };

  const labPanel = (id, title, what, light, body) => `
    <section class="lab-panel" id="lab-${id}">
      <div class="lab-head"><h4>${title}</h4><a href="/docs/seeing-sound.html#${id}" target="_blank" rel="noopener" class="desc">How it works ↗</a></div>
      <p class="desc">${what}</p>
      ${body}
      <p class="lab-light"><strong>On the wall</strong> ${light}</p>
    </section>`;

  function labHtml() {
    return `
      <div class="lab">
        <aside class="lab-side">
          <div class="lab-card">
            <h4>Sound source</h4>
            <div class="btnrow">
              <button class="btn small" data-lab="mic">🎤 Microphone</button>
              <button class="btn small" data-lab="system">🔊 System sound</button>
              <label class="btn small" for="labFile">🎵 Song file</label><input type="file" id="labFile" accept="audio/*" hidden />
              <button class="btn small ghost" data-lab="stop">Stop</button>
            </div>
            <audio id="labAudio" controls hidden></audio>
            <p class="desc" id="labSourceNote">Pick a source. Everything below is measured live from it.</p>
          </div>
          <div class="lab-card">
            <h4>On the wall</h4>
            <canvas id="labWall" class="lab-wall" aria-label="Wall preview"></canvas>
            <div class="btnrow"><button class="btn primary" data-lab="wall" id="labWallBtn">▶ Play Full mix</button></div>
            <label class="check"><input type="checkbox" id="labLive" /> Send to real bulbs</label>
            <div class="lab-layers" id="labLayers" role="group" aria-label="Layers">${LAB_LAYERS.map(([k, l]) => `<button data-layer="${k}" aria-pressed="true">${l}</button>`).join('')}</div>
            <p class="desc">Each layer is driven by one property of the sound. Switch layers off to watch one part on its own.</p>
          </div>
        </aside>
        <div class="lab-grid">
          ${labPanel('spectrum', 'Spectrogram', 'Frequencies over time: low notes at the bottom, high at the top, newest on the right. Brighter = louder.', 'the six bands feed the bass column and the background.',
            `<canvas id="labSpectro" class="lab-scope tall" aria-label="Spectrogram"></canvas>`)}
          ${labPanel('loudness', 'Loudness', 'How big the air-pressure swings are. Peak = the tallest swing; RMS = the average power, closer to what you hear.', 'overall energy brightens the background wash.',
            `<canvas id="labWave" class="lab-scope" aria-label="Waveform, left in amber and right in blue"></canvas><div class="readouts"><span>Peak <b id="lab-peak">–</b></span><span>RMS <b id="lab-rms">–</b></span><span>Level <b id="lab-level">–</b></span></div>`)}
          ${labPanel('bands', 'Bands', 'The spectrum grouped like a mixing desk: sub, bass, low-mids, mids, upper mids, air.', 'sub + bass set the height of the warm bass column.',
            `<canvas id="labBands" class="lab-scope" aria-label="Band levels"></canvas>`)}
          ${labPanel('rhythm', 'Rhythm', 'Drum hits found by sudden rises in the kick, snare and hi-hat ranges, and the beat they line up on.', 'kicks thump the floor, snares crack the ceiling, hi-hats glint.',
            `<div class="lab-lamps"><span class="lamp k" id="lamp-kick">Kick</span><span class="lamp s" id="lamp-snare">Snare</span><span class="lamp h" id="lamp-hat">Hi-hat</span></div><div class="readouts"><span>Tempo <b id="lab-bpm">–</b></span><span id="lab-lock" class="pill warn">Listening…</span><span class="bar-dots" id="lab-bar"><i></i><i></i><i></i><i></i></span></div>`)}
          ${labPanel('brightness', 'Timbre', 'The colour of the sound: how bright (centre of the spectrum), how noisy (hiss vs clear tones) and how fast it is changing.', 'brightness sets amber ↔ ice white; noisiness adds more glints.',
            `<canvas id="labTimbre" class="lab-scope short" aria-label="Brightness, noisiness and change"></canvas><div class="readouts"><span>Centroid <b id="lab-cent">–</b></span></div>`)}
          ${labPanel('harmony', 'Melody &amp; notes', 'The strongest note right now (when there is a clear one) and the energy in each of the 12 note names.', 'the melody is a point: higher note = higher on the wall.',
            `<div class="lab-note"><b id="lab-note">–</b><span class="desc" id="lab-note-conf"></span></div><canvas id="labChroma" class="lab-scope short" aria-label="Energy per note name"></canvas>`)}
          ${labPanel('stereo', 'Stereo', 'Where sound sits between the speakers. The vectorscope draws left against right: a vertical line is mono, a wide cloud is stereo.', 'the melody point moves to the side the mids are panned to; width spreads the wash.',
            `<div class="lab-stereo"><canvas id="labVector" class="lab-vector" aria-label="Vectorscope"></canvas><div><div class="readouts" style="flex-direction:column;gap:2px"><span>Balance <b id="lab-bal">–</b></span><span>Width <b id="lab-wid">–</b></span></div><canvas id="labPans" class="lab-pans" aria-label="Position of low, mid and high"></canvas></div></div>`)}
        </div>
      </div>`;
  }

  function labSourceNote() {
    const note = $('#labSourceNote');
    if (!note) return;
    const src = AUDIO.source;
    note.textContent = src === 'mic' ? 'Listening to the microphone. A single built-in mic is mono, so stereo stays centred.'
      : src === 'system' ? 'Listening to the shared sound.'
      : src === 'file' ? 'Playing the song file through the analyser.'
      : AUDIO.error || 'Pick a source. Everything below is measured live from it.';
    labAll('[data-lab=mic],[data-lab=system]').forEach((b) => b.classList.toggle('source-on', b.dataset.lab === src));
  }

  async function labUseFile(file) {
    if (!file) return;
    const el = $('#labAudio');
    if (SHOW.playing) showPause();
    if (LAB.url) URL.revokeObjectURL(LAB.url);
    LAB.url = URL.createObjectURL(file);
    el.src = LAB.url;
    el.hidden = false;
    try {
      const a = analyzer();
      await a.useElement(el);
      AUDIO.source = 'file';
      attachAnalyzer(true);
      await setSource('live');
      await el.play();
    } catch (e) { toast("Couldn't play that file", e.message, true); }
    labSourceNote();
  }

  function labUpdateWallButton() {
    const st = MX.info?.status;
    const on = !!st?.running && st.pattern === 'mix';
    const b = $('#labWallBtn');
    if (b) { b.textContent = on ? '■ Stop' : '▶ Play Full mix'; b.classList.toggle('primary', !on); }
    const live = $('#labLive');
    if (live) live.checked = !MX.options.preview;
  }

  async function labToggleWall() {
    const st = MX.info?.status;
    try {
      if (st?.running && st.pattern === 'mix') MX.info.status = await api('/matrix/stop', { method: 'POST' });
      else {
        if (!AUDIO.source) toast('No sound yet', 'Pick a source on the left so the wall has something to follow.');
        MX.info.status = await api('/matrix/play', { body: { pattern: 'mix', params: LAB.layers, options: { ...MX.options, palette: 'dual', stepOn: 'timer', tickMs: 400 } } });
      }
    } catch (e) { toast(e.message, e.hint, true); }
    labUpdateWallButton();
  }

  function wireLab() {
    const v = $('#labView');
    v.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-lab],[data-layer]');
      if (!b) return;
      if (b.dataset.layer) {
        const k = b.dataset.layer;
        LAB.layers[k] = !LAB.layers[k];
        b.setAttribute('aria-pressed', String(LAB.layers[k]));
        if (MX.info?.status?.running && MX.info.status.pattern === 'mix') api('/matrix/update', { body: { params: LAB.layers } }).catch(() => {});
        return;
      }
      const act = b.dataset.lab;
      if (act === 'mic' || act === 'system') { $('#labAudio').pause(); await startSource(act); labSourceNote(); }
      if (act === 'stop') { $('#labAudio').pause(); stopSource(); labSourceNote(); }
      if (act === 'wall') labToggleWall();
    });
    $('#labFile').addEventListener('change', (e) => labUseFile(e.target.files[0]));
    $('#labLive').addEventListener('change', (e) => {
      if (e.target.checked && !confirm('Send the Full mix to the real bulbs?')) { e.target.checked = false; return; }
      MX.options.preview = !e.target.checked;
      api('/matrix/update', { body: { options: { preview: MX.options.preview } } }).catch(() => {});
    });
  }

  async function renderLab() {
    try { MX.info = await api('/matrix'); } catch {}
    if (!LAB.built) {
      $('#labView').innerHTML = MX.info?.layout ? labHtml() : `<div class="empty" style="padding:60px 16px"><h2>Set up the matrix first</h2><p>The Sound Lab plays on your bulb wall. Create the grid in the Matrix tab.</p></div>`;
      if (!MX.info?.layout) return;
      wireLab();
      LAB.built = true;
    }
    labSourceNote();
    labUpdateWallButton();
    labDrawIdle();
    clearInterval(LAB.pollTimer);
    LAB.pollTimer = setInterval(labPoll, 110);
  }

  async function labPoll() {
    if ($('#labView').hidden || document.visibilityState !== 'visible') return;
    try {
      MX.info.status = await api('/matrix/status');
      labDrawWall(MX.info.status);
      if (++LAB.n % 9 === 0) labUpdateWallButton();
    } catch {}
  }

  function labDrawWall(st) {
    const k = labCanvas('labWall');
    if (!k) return;
    const { g, W, H } = k;
    g.fillStyle = '#070809'; g.fillRect(0, 0, W, H);
    const rows = MX.info.layout.rows, cols = MX.info.layout.cols;
    const frame = st?.running ? st.frame : [];
    const warm = st?.warm;
    const pal = st?.options?.palette || 'dual';
    const cell = Math.min((W * 0.92) / cols, (H * 0.94) / rows);
    const ox = (W - cell * cols) / 2 + cell / 2, oy = (H - cell * rows) / 2 + cell / 2, R = cell * 0.33;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const v = frame[r]?.[c] ?? 0;
      const wv = pal === 'dual' ? warm?.[r]?.[c] ?? 1 : pal === 'warm' ? 0 : pal === 'neutral' ? 0.35 : 1;
      const col = labMix(LAB_WARM, LAB_COOL, wv);
      const x = ox + c * cell, y = oy + r * cell;
      if (v > 0.03) {
        const gl = g.createRadialGradient(x, y, R * 0.4, x, y, R * (1.6 + 1.4 * v));
        gl.addColorStop(0, labRgb(col, 0.55 * v)); gl.addColorStop(1, labRgb(col, 0));
        g.fillStyle = gl; g.beginPath(); g.arc(x, y, R * (1.6 + 1.4 * v), 0, Math.PI * 2); g.fill();
      }
      g.beginPath(); g.arc(x, y, R, 0, Math.PI * 2);
      g.fillStyle = labRgb(labMix([24, 26, 30], col, Math.pow(v, 0.7))); g.fill();
      g.strokeStyle = 'rgba(255,255,255,0.07)'; g.lineWidth = 1; g.stroke();
    }
  }

  function labDrawIdle() {
    labDrawWall(null);
    for (const id of ['labWave', 'labSpectro', 'labBands', 'labTimbre', 'labChroma', 'labVector', 'labPans']) {
      const k = labCanvas(id);
      if (!k) continue;
      k.g.fillStyle = '#0d0e10'; k.g.fillRect(0, 0, k.W, k.H);
      if (!AUDIO.source && id === 'labSpectro') labLabel(k.g, 'Pick a sound source to start', k.W / 2, k.H / 2, 'center');
    }
  }

  /** Called for every analysis frame (~60/s) while a source is running. */
  function labFeatures(f) {
    if ($('#labView').hidden || !LAB.built) return;
    const a = analyzer();
    LAB.n2 = (LAB.n2 || 0) + 1;
    const slow = LAB.n2 % 6 === 0;
    // Loudness: left (amber) and right (blue) waveforms.
    {
      const { g, W, H } = labCanvas('labWave');
      g.fillStyle = '#0d0e10'; g.fillRect(0, 0, W, H);
      for (const [data, col] of [[a.tl, labRgb(LAB_WARM, 0.85)], [a.tr, labRgb(LAB_COOL, 0.75)]]) {
        g.strokeStyle = col; g.lineWidth = 1.5; g.beginPath();
        for (let x = 0; x < W; x++) { const s = data[Math.floor((x / W) * data.length)] || 0; const y = H / 2 - s * H * 0.45; x ? g.lineTo(x, y) : g.moveTo(x, y); }
        g.stroke();
      }
      if (slow) {
        let sum = 0, peak = 0;
        for (const s of a.time) { sum += s * s; peak = Math.max(peak, Math.abs(s)); }
        $('#lab-peak').textContent = `${(20 * Math.log10(peak + 1e-9)).toFixed(1)} dBFS`;
        $('#lab-rms').textContent = `${(20 * Math.log10(Math.sqrt(sum / a.time.length) + 1e-9)).toFixed(1)} dBFS`;
        $('#lab-level').textContent = `${Math.round(f.level * 100)}%`;
      }
    }
    // Spectrogram (log frequency), scrolling left.
    {
      const k = labCanvas('labSpectro');
      if (!LAB.img || LAB.img.width !== k.c.width || LAB.img.height !== k.c.height) { LAB.img = document.createElement('canvas'); LAB.img.width = k.c.width; LAB.img.height = k.c.height; }
      const ig = LAB.img.getContext('2d');
      ig.drawImage(LAB.img, -2, 0);
      const binHz = a.ctx.sampleRate / a.analyser.fftSize, ph = LAB.img.height;
      for (let y = 0; y < ph; y++) {
        const hz = 30 * Math.pow(16000 / 30, 1 - y / ph);
        const db = a.freq[Math.min(a.freq.length - 1, Math.round(hz / binHz))];
        const val = Math.max(0, Math.min(1, (db + 100) / 72));
        ig.fillStyle = labRgb(val < 0.5 ? labMix([13, 14, 16], LAB_WARM, val * 2) : labMix(LAB_WARM, LAB_COOL, (val - 0.5) * 2));
        ig.fillRect(LAB.img.width - 2, y, 2, 1);
      }
      k.g.drawImage(LAB.img, 0, 0, k.W, k.H);
      [100, 1000, 10000].forEach((hz) => labLabel(k.g, hz >= 1000 ? `${hz / 1000}k` : `${hz}`, 4, (1 - Math.log(hz / 30) / Math.log(16000 / 30)) * k.H - 2));
    }
    // Bands.
    {
      const { g, W, H } = labCanvas('labBands');
      g.fillStyle = '#0d0e10'; g.fillRect(0, 0, W, H);
      const names = ['Sub', 'Bass', 'Low-mid', 'Mid', 'Up-mid', 'Air'], bw = W / 6;
      f.bands.forEach((v, i) => { g.fillStyle = labRgb(labMix(LAB_WARM, LAB_COOL, i / 5), 0.9); g.fillRect(i * bw + 5, H - 16 - v * (H - 22), bw - 10, v * (H - 22)); labLabel(g, names[i], i * bw + bw / 2, H - 3, 'center'); });
    }
    // Rhythm lamps, tempo, bar position.
    for (const o of f.onsets) {
      const lamp = $('#lamp-' + o.type);
      if (lamp) { lamp.classList.remove('hit'); void lamp.offsetWidth; lamp.classList.add('hit'); }
    }
    const tr = a.tracker;
    if (slow) {
      $('#lab-bpm').textContent = tr.bpm ? `${tr.bpm} BPM` : '–';
      const lock = $('#lab-lock');
      lock.className = 'pill ' + (tr.locked ? 'ok' : 'warn');
      lock.textContent = tr.locked ? 'Beat locked' : tr.bpm ? 'Finding the beat…' : 'Listening…';
    }
    if (tr.period) {
      const beatNow = Math.floor(tr.beatIndex + (IotAudio.wallNow() - tr.nextBeat) / tr.period);
      const inBar = (((beatNow - tr.downSlot) % 4) + 4) % 4;
      labAll('#lab-bar i').forEach((d, i) => d.classList.toggle('on', tr.locked && i === inBar));
    }
    // Timbre bars.
    {
      const { g, W, H } = labCanvas('labTimbre');
      g.fillStyle = '#0d0e10'; g.fillRect(0, 0, W, H);
      const rows = [['Brightness', f.timbre.centroid, labMix(LAB_WARM, LAB_COOL, f.timbre.centroid)], ['Noisiness', f.timbre.flatness, LAB_COOL], ['Change', f.timbre.flux, [233, 220, 198]]];
      const rh = H / 3;
      rows.forEach(([name, v, col], i) => {
        labLabel(g, name, 4, i * rh + rh / 2 + 4);
        g.fillStyle = '#1c1e22'; g.fillRect(90, i * rh + rh * 0.25, W - 96, rh * 0.5);
        g.fillStyle = labRgb(col, 0.95); g.fillRect(90, i * rh + rh * 0.25, (W - 96) * Math.max(0, Math.min(1, v)), rh * 0.5);
      });
      if (slow) $('#lab-cent').textContent = f.timbre.centroidHz >= 1000 ? `${(f.timbre.centroidHz / 1000).toFixed(2)} kHz` : `${Math.round(f.timbre.centroidHz)} Hz`;
    }
    // Melody + chroma.
    {
      if (slow) {
        $('#lab-note').textContent = f.pitch ? `${NOTE[f.pitch.midi % 12]}${Math.floor(f.pitch.midi / 12) - 1}` : '–';
        $('#lab-note-conf').textContent = f.pitch ? `clarity ${Math.round(f.pitch.confidence * 100)}%` : f.level > 0.08 ? 'no clear note' : '';
      }
      const { g, W, H } = labCanvas('labChroma');
      g.fillStyle = '#0d0e10'; g.fillRect(0, 0, W, H);
      const bw = W / 12;
      f.chroma.forEach((v, i) => { g.fillStyle = labRgb(labMix(LAB_WARM, LAB_COOL, v), 0.25 + 0.75 * v); g.fillRect(i * bw + 3, H - 15 - v * (H - 22), bw - 6, Math.max(2, v * (H - 22))); labLabel(g, NOTE[i], i * bw + bw / 2, H - 3, 'center'); });
    }
    // Stereo: vectorscope + position of low/mid/high.
    {
      const { g, W, H } = labCanvas('labVector');
      g.fillStyle = 'rgba(13,14,16,0.35)'; g.fillRect(0, 0, W, H);
      const cx = W / 2, cy = H / 2, sc = Math.min(W, H) * 0.9;
      g.strokeStyle = 'rgba(255,255,255,0.08)'; g.beginPath(); g.moveTo(cx, 4); g.lineTo(cx, H - 4); g.moveTo(4, cy); g.lineTo(W - 4, cy); g.stroke();
      g.fillStyle = labRgb(LAB_COOL, 0.55);
      for (let i = 0; i < a.tl.length; i += 2) { const L = a.tl[i], R = a.tr[i]; g.fillRect(cx + (R - L) * sc * 0.7, cy - (L + R) * sc * 0.7, 1.4, 1.4); }
      labLabel(g, 'L', 4, cy - 4); labLabel(g, 'R', W - 4, cy - 4, 'right');
      const p = labCanvas('labPans');
      p.g.fillStyle = '#0d0e10'; p.g.fillRect(0, 0, p.W, p.H);
      const rh = p.H / 3;
      [['Low', f.stereo.pan[0]], ['Mid', f.stereo.pan[1]], ['High', f.stereo.pan[2]]].forEach(([name, v], i) => {
        const y = i * rh + rh / 2, x0 = 40, x1 = p.W - 8, xm = (x0 + x1) / 2;
        labLabel(p.g, name, 2, y + 4);
        p.g.fillStyle = '#1c1e22'; p.g.fillRect(x0, y - 1, x1 - x0, 2);
        p.g.fillStyle = 'rgba(255,255,255,0.25)'; p.g.fillRect(xm - 0.5, y - 6, 1, 12);
        p.g.fillStyle = labRgb(labMix(LAB_WARM, LAB_COOL, i / 2)); p.g.beginPath(); p.g.arc(xm + v * (x1 - x0) / 2, y, 5, 0, Math.PI * 2); p.g.fill();
      });
      if (slow) {
        const b = f.stereo.balance;
        $('#lab-bal').textContent = Math.abs(b) < 0.03 ? 'centre' : `${b < 0 ? 'left' : 'right'} ${Math.abs(b).toFixed(2)}`;
        $('#lab-wid').textContent = `${Math.round(f.stereo.width * 100)}%`;
      }
    }
  }

  // Read-only handle for debugging from the browser console.
  window.iotDebug = { S, MX, AUDIO, SHOW, LAB };

  (async () => {
    await loadDevices().catch((e) => toast('Cannot reach the iot-hub server', 'Is `iot ui` still running?', true));
    loadGuide();
    let view = 'devices';
    try { view = localStorage.getItem('iot-hub:view') || 'devices'; } catch {}
    if (view === 'matrix' || view === 'lab') showView(view);
    if (!S.devices.length) scan();
    else refreshStates();
    api('/effect').then(setClub).catch(() => {});
    setInterval(() => {
      if (document.visibilityState !== 'visible' || S.scanning) return;
      api('/effect').then(setClub).catch(() => {});
      // While the club effect runs, states change every half second; polling just adds traffic.
      if (!club.running && !mxRunning()) refreshStates();
    }, 5000);
    // Pick up devices found by the server's background rescan.
    setInterval(async () => {
      if (document.visibilityState !== 'visible' || S.scanning) return;
      try {
        const { devices } = await api('/devices');
        const known = new Set(S.devices.map((d) => d.id));
        const fresh = devices.filter((d) => !known.has(d.id));
        if (fresh.length || devices.length !== S.devices.length) {
          S.devices = devices;
          renderGrid();
          if (fresh.length) { toast(`${fresh.length} new device${fresh.length > 1 ? 's' : ''} came online`); refreshStates(fresh.map((d) => d.id)); }
        }
      } catch {}
    }, 30000);
  })();
})();
</script>
</body>
</html>
